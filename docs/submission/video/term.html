<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>latinos-vm</title>
<!-- Replays a real SSH session on our L1CC VM, captured Sat Oct 17 2026 ~20:45 ET (outputs verbatim, IP omitted). -->
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; }
  body { display: flex; align-items: center; justify-content: center; font: 17px/1.45 "Cascadia Mono", Consolas, monospace; color: #d6dde6; }
  .win { width: 1180px; height: 640px; background: #0f141b; border: 1px solid #2a3341; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px #0008; }
  .bar { height: 34px; background: #1a212b; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #8b98a8; font-size: 13px; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; } .bar span { margin-left: 10px; }
  pre { margin: 0; padding: 14px 18px; white-space: pre-wrap; font: inherit; height: 590px; overflow: hidden; }
  .p { color: #7ee787; } .c { color: #ffffff; } .o { color: #c9d1d9; } .hl { color: #ffa657; font-weight: 700; }
  .cur { display: inline-block; width: 9px; height: 18px; background: #d6dde6; vertical-align: text-bottom; animation: b 1s steps(1) infinite; }
  @keyframes b { 50% { opacity: 0; } }
</style></head>
<body>
<div class="win"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>linux1@latinos-vm: ~ (ssh, IBM LinuxONE Community Cloud)</span></div><pre id="t"></pre></div>
<script>
const P = '<span class="p">linux1@latinos-vm:~$</span> ';
const steps = [
  ['lscpu | grep -E "Architecture|Byte Order|^CPU\\(s\\)|Machine type"',
   'Architecture:                            s390x\nByte Order:                              Big Endian\nCPU(s):                                  3\nMachine type:                            <span class="hl">9175</span>          <span style="color:#8b98a8"># IBM z17</span>'],
  ['grep -o -w nnpa /proc/cpuinfo | head -1', '<span class="hl">nnpa</span>          <span style="color:#8b98a8"># Telum on-chip AI accelerator</span>'],
  ['sudo docker ps --format "table {{.Names}}\\t{{.Image}}\\t{{.Status}}\\t{{.Ports}}"',
   'NAMES     IMAGE         STATUS                    PORTS\n<span class="hl">evac-ai</span>   evac-ai:go2   Up 38 minutes (healthy)   127.0.0.1:8000->8000/tcp'],
  ['curl -s "localhost:8000/api/scenario?replay=oct11&warn=03:30" | jq -c .summary',
   '{"warning":"03:30","settlements_at_risk":20,"people_at_risk":1456.0,"people_without_time":<span class="hl">0.0</span>,"red":0,"amber":2}'],
  ['curl -s "localhost:8000/api/scenario?replay=oct11&warn=06:40" | jq -c .summary',
   '{"warning":"06:40","settlements_at_risk":20,"people_at_risk":1456.0,"people_without_time":<span class="hl">1456.0</span>,"red":20,"amber":0}'],
];
const el = document.getElementById('t'); let html = '';
const sleep = ms => new Promise(r => setTimeout(r, ms));
window.done = false;
(async () => {
  await sleep(500);
  for (const [cmd, out] of steps) {
    for (let i = 1; i <= cmd.length; i++) {
      el.innerHTML = html + P + '<span class="c">' + cmd.slice(0, i).replace(/</g, '&lt;') + '</span><span class="cur"></span>';
      await sleep(cmd.length > 60 ? 14 : 24);
    }
    await sleep(250);
    html += P + '<span class="c">' + cmd.replace(/</g, '&lt;') + '</span>\n<span class="o">' + out + '</span>\n';
    el.innerHTML = html + P + '<span class="cur"></span>';
    await sleep(1300);
  }
  window.done = true;
})();
</script>
</body></html>
